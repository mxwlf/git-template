# Azure DevOps wrapper: provision Python and run the Makefile's PR or
# post-integration acceptance entry point. Project-specific build and release
# operations remain in the repository and its derived templates.

# Pull requests are validated for either protected branch. Pushes to develop
# run acceptance on the resulting commit. For Azure Repos, configure PR build
# validation through branch policies; YAML `pr` triggers are provider-dependent.
trigger:
  branches:
    include:
      - develop

pr:
  branches:
    include:
      - develop
      - main

pool:
  # Pinned rather than `ubuntu-latest`: that label is remapped to a new Ubuntu
  # release periodically, which would change the build environment underneath
  # you on Microsoft's schedule instead of yours. Bump this deliberately.
  vmImage: ubuntu-24.04

steps:
  # Interpreter used to build .venv. Any version >= 3.10 works (see MIN_PYTHON
  # in the Makefile); it is pinned here only for reproducible runs, not because
  # the hooks need this exact version.
  - task: UsePythonVersion@0
    inputs:
      versionSpec: "3.14"

  # Cache pre-commit hook environments keyed on the config so unchanged hooks
  # are not rebuilt on every run.
  - task: Cache@2
    inputs:
      key: 'pre-commit | "$(Agent.OS)" | .pre-commit-config.yaml'
      path: $(HOME)/.cache/pre-commit

  # PR checks and post-integration acceptance remain independently extensible.
  - script: make ci
    displayName: Pull request checks
    condition: eq(variables['Build.Reason'], 'PullRequest')

  - script: make acceptance
    displayName: Post-integration acceptance
    condition: ne(variables['Build.Reason'], 'PullRequest')
